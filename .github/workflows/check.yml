name: Build tooling checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m pip install 'ansible-core>=2.18,<2.19'
      - run: ansible-playbook -i ansible/inventory.example.ini ansible/site.yml --syntax-check
      - run: node --check ai/web/app.js
      - run: node --check extensions/africanbrowser-support/background.js
      - run: python -m unittest discover -s tests -v
      - run: python scripts/legal_assets.py
      - run: git diff --exit-code -- ai/web/legal extensions/africanbrowser-support/legal
      - run: python scripts/browser.py plan --target android --cpu arm64
      - run: python scripts/browser.py plan --target ios --cpu arm64
