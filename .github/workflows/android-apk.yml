name: Chromium Android APK
run-name: ${{ inputs.deploy_request || github.event.head_commit.message || 'AfricanBrowser Android build' }}
# Build the current branding and homepage with exact-source checkpoints.
# Rebuild requested: AfricanBrowser launcher name and icon, 2026-10-18T05:24:59Z.
on:
  workflow_dispatch:
    inputs:
      deploy_request:
        description: Unique deployment request identifier
        required: false
        type: string
  push:
    branches: [main]
    paths: ['.github/workflows/android-apk.yml', '.github/workflows/android-segment.yml', 'scripts/branding.py', 'scripts/logo_assets.py', 'scripts/browser.py', 'assets/branding/**', 'config/**']
permissions:
  contents: read
concurrency:
  group: chromium-android-apk
  cancel-in-progress: false
jobs:
  first:
    uses: ./.github/workflows/android-segment.yml
    with:
      segment: 1
  second:
    needs: first
    if: needs.first.outputs.complete != 'true'
    uses: ./.github/workflows/android-segment.yml
    with:
      segment: 2
  third:
    needs: second
    if: needs.second.outputs.complete != 'true'
    uses: ./.github/workflows/android-segment.yml
    with:
      segment: 3
  fourth:
    needs: third
    if: needs.third.outputs.complete != 'true'
    uses: ./.github/workflows/android-segment.yml
    with:
      segment: 4
  verify_apk:
    needs: [first, second, third, fourth]
    if: always()
    runs-on: ubuntu-24.04
    env:
      COMPLETED: ${{ needs.first.outputs.complete == 'true' || needs.second.outputs.complete == 'true' || needs.third.outputs.complete == 'true' || needs.fourth.outputs.complete == 'true' }}
    steps:
      - name: Require an actual completed APK build
        run: test "$COMPLETED" = true
      - uses: actions/download-artifact@v4
        with:
          name: AfricanBrowser-Android-ARM64-development
          path: verified-apk/
      - name: Install Android resource inspector
        run: sudo apt-get update && sudo apt-get install -y aapt
      - name: Require AfricanBrowser installed app and launcher display names
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          import re, subprocess
          apks = list(Path('verified-apk').rglob('AfricanBrowser.apk'))
          assert len(apks) == 1, 'Expected one compiled APK'
          badging = subprocess.check_output(['aapt', 'dump', 'badging', str(apks[0])], text=True)
          labels = re.findall(r"^application-label(?:-[^:]+)?:'([^']*)'", badging, re.M)
          assert labels and all(label == 'AfricanBrowser' for label in labels), labels
          launchers = re.findall(r"^launchable-activity:.*?label='([^']*)'.*?icon='([^']*)'", badging, re.M)
          assert launchers, 'Missing launcher activity'
          assert all(label in ('', 'AfricanBrowser') and icon for label, icon in launchers), launchers
          assert "package: name='org.africanbrowser.browser'" in badging
          print('Verified AfricanBrowser app name, launcher display name, and icon resource.')
          PYTHON
      - name: Verify uploaded APK exists and contains the browser engine
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          apks = list(Path('verified-apk').rglob('AfricanBrowser.apk'))
          assert len(apks) == 1, 'No unique compiled APK was uploaded'
          with zipfile.ZipFile(apks[0]) as apk:
              assert 'AndroidManifest.xml' in apk.namelist()
              assert 'classes.dex' in apk.namelist()
              assert any(name.startswith('lib/arm64-v8a/') and name.endswith('.so') for name in apk.namelist())
          print('Verified the uploaded ARM64 APK artifact.')
          PY
