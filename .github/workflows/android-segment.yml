name: Resumable Chromium compilation segment
on:
  workflow_call:
    inputs:
      segment:
        required: true
        type: number
    outputs:
      complete:
        value: ${{ jobs.compile.outputs.complete }}
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    outputs:
      complete: ${{ steps.result.outputs.complete }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reclaim unused SDK storage on this disposable runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost
          sudo apt-get update
          sudo apt-get install -y zstd
          df -h "$GITHUB_WORKSPACE"
      - run: python -m pip install -r requirements-build.txt
      - run: python scripts/browser.py doctor --target android --cpu arm64
      - name: Fetch pinned source and dependencies
        run: python scripts/browser.py checkout --target android --cpu arm64
      - run: sudo work/android/src/build/install-build-deps.sh --android --no-prompt
      - name: Restore most recent compilation checkpoint for this exact commit
        uses: actions/cache/restore@v4
        with:
          path: .build-checkpoint/
          key: android-checkpoint-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.segment }}
          restore-keys: android-checkpoint-${{ github.sha }}-
      - name: Compile for at most 270 minutes and preserve completed outputs
        run: python scripts/browser.py build --target android --cpu arm64 --checkpoint .build-checkpoint --segment-seconds 16200 --jobs 4
      - name: Read completion status
        id: result
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('build-status.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('complete=' + str(data['complete']).lower() + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('APK compiled: ' + str(data['complete']) + '\n')
          PY
      - name: Save bounded checkpoint without increasing the repository cache limit
        if: steps.result.outputs.complete != 'true'
        uses: actions/cache/save@v4
        with:
          path: .build-checkpoint/
          key: android-checkpoint-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.segment }}
      - name: Package the real compiled APK
        if: steps.result.outputs.complete == 'true'
        run: python scripts/browser.py package --target android --cpu arm64
      - uses: actions/upload-artifact@v4
        if: steps.result.outputs.complete == 'true'
        with:
          name: AfricanBrowser-Android-ARM64-development
          path: dist/
          if-no-files-found: error
          retention-days: 7
